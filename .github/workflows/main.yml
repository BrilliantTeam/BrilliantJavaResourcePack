name: 壓縮 zip、計算 SHA-1 並發佈到 Tag
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出儲存庫
        uses: actions/checkout@v4

      - name: 設置版本變量
        id: set_var
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "Branch name is: $BRANCH_NAME"
          
          if [[ "$BRANCH_NAME" == "main" ]]; then
            echo "ZIP_LIGHT=bsje.zip" >> "$GITHUB_OUTPUT"
            echo "ZIP_DARK=bsje-dark.zip" >> "$GITHUB_OUTPUT"
            echo "ZIP_ICD=bsje-icd.zip" >> "$GITHUB_OUTPUT"

            echo "ASSET_LIGHT=bsje.zip" >> "$GITHUB_OUTPUT"
            echo "ASSET_DARK=bsje-dark.zip" >> "$GITHUB_OUTPUT"
            echo "ASSET_ICD=bsje-icd.zip" >> "$GITHUB_OUTPUT"
          else
            echo "ZIP_LIGHT=bsje-unknown.zip" >> "$GITHUB_OUTPUT"
            echo "ZIP_DARK=bsje-unknown-dark.zip" >> "$GITHUB_OUTPUT"
            echo "ZIP_ICD=bsje-unknown-icd.zip" >> "$GITHUB_OUTPUT"

            echo "ASSET_LIGHT=bsje-unknown.zip" >> "$GITHUB_OUTPUT"
            echo "ASSET_DARK=bsje-unknown-dark.zip" >> "$GITHUB_OUTPUT"
            echo "ASSET_ICD=bsje-unknown-icd.zip" >> "$GITHUB_OUTPUT"
          fi

      - name: 壓縮基礎檔案（所有版本共用）
        run: |
          BASE_FILES="assets/ 26.1/ LICENSE.txt pack.mcmeta pack.png"
          
          echo "Creating base ZIPs..."
          
          zip -r "${{ steps.set_var.outputs.ZIP_LIGHT }}" $BASE_FILES -x "darkmode/**" || exit 1
          cp "${{ steps.set_var.outputs.ZIP_LIGHT }}" "${{ steps.set_var.outputs.ZIP_DARK }}"
          
          echo "Base ZIPs created."

      - name: 壓縮 ICD 版本
        run: |
          cp pack.mcmeta pack.mcmeta.original
          cp pack.mcmeta-icd pack.mcmeta
          zip -r "${{ steps.set_var.outputs.ZIP_ICD }}" assets/ LICENSE.txt pack.mcmeta pack.png || exit 1
          cp pack.mcmeta.original pack.mcmeta
          echo "ICD ZIP created."

      - name: 合併 darkmode 到 Dark 版
        if: always()
        run: |
          if [ -d "darkmode/assets" ]; then
            echo "Merging darkmode/assets/ into ${{ steps.set_var.outputs.ZIP_DARK }}..."
            cd darkmode && zip -r "../${{ steps.set_var.outputs.ZIP_DARK }}" assets/ && cd ..
          else
            echo "No darkmode/assets/ folder found, skipping."
          fi

      - name: 驗證 ZIP 檔案
        run: |
          echo "Final ZIP files:"
          ls -la *.zip || true

      - name: 計算 SHA1
        id: hash
        run: |
          LIGHT_SHA1=$(sha1sum "${{ steps.set_var.outputs.ZIP_LIGHT }}" | cut -d' ' -f1)
          DARK_SHA1=$(sha1sum "${{ steps.set_var.outputs.ZIP_DARK }}" | cut -d' ' -f1)
          ICD_SHA1=$(sha1sum "${{ steps.set_var.outputs.ZIP_ICD }}" | cut -d' ' -f1)

          echo "RESOURCE_SHA1_LIGHT=$LIGHT_SHA1" >> "$GITHUB_OUTPUT"
          echo "RESOURCE_SHA1_DARK=$DARK_SHA1" >> "$GITHUB_OUTPUT"
          echo "RESOURCE_SHA1_ICD=$ICD_SHA1" >> "$GITHUB_OUTPUT"

          echo "Light SHA1: $LIGHT_SHA1"
          echo "Dark SHA1: $DARK_SHA1"
          echo "ICD SHA1: $ICD_SHA1"

      - name: 發佈並上傳 Release 
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.run_number }}
          name: Version ${{ github.run_number }} | ${{ github.event.head_commit.message }}
          body: |
            可於 **Assets** 區塊中選擇下載：
            - 亮色模式：`${{ steps.set_var.outputs.ASSET_LIGHT }}`
            - 暗色模式：`${{ steps.set_var.outputs.ASSET_DARK }}`

            建議下載標有 **Latest** 的版本以獲得最佳體驗。
            ---
            ```yaml
            packs:
              lightmode: 
                url: https://github.com/BrilliantTeam/BrilliantJavaResourcePack/releases/download/${{ github.run_number }}/${{ steps.set_var.outputs.ZIP_LIGHT }}
                hash: ${{ steps.hash.outputs.RESOURCE_SHA1_LIGHT }}
                restricted: true
                permission: bungeeresourcepacks.pack.lightmode
              darkmode:
                url: https://github.com/BrilliantTeam/BrilliantJavaResourcePack/releases/download/${{ github.run_number }}/${{ steps.set_var.outputs.ZIP_DARK }}
                hash: ${{ steps.hash.outputs.RESOURCE_SHA1_DARK }}
                restricted: true
                permission: bungeeresourcepacks.pack.darkmode
            ```

            Copyright © 輝煌伺服器 Brilliant Minecraft Server 版權所有 All rights reserved
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ${{ steps.set_var.outputs.ZIP_LIGHT }}
            ${{ steps.set_var.outputs.ZIP_DARK }}
            ${{ steps.set_var.outputs.ZIP_ICD }}